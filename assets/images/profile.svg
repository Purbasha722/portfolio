<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated portrait placeholder for Miftahul Zannati Purba">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D9BE"/>
      <stop offset="100%" stop-color="#E3C09E"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#00C7BE"/>
    </linearGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#005BB8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#F5F5F7"/>
  <circle cx="200" cy="170" r="190" fill="url(#glow)"/>

  <!-- shoulders / scarf -->
  <path d="M56 400 Q100 258 200 256 Q300 258 344 400 Z" fill="url(#scarf)"/>
  <path d="M150 268 Q200 300 250 268 L250 300 Q200 332 150 300 Z" fill="#005BB8" opacity="0.55"/>

  <!-- neck -->
  <rect x="172" y="226" width="56" height="46" rx="18" fill="#E3C09E"/>

  <!-- head -->
  <ellipse cx="200" cy="166" rx="86" ry="94" fill="url(#face)"/>

  <!-- hair -->
  <path d="M114 168 Q104 76 200 64 Q296 76 286 168 Q286 116 250 98 Q214 126 200 106 Q186 126 150 98 Q114 116 114 168 Z" fill="#1D1D1F"/>

  <!-- hijab-style soft drape (keeps identity illustrative, not photoreal) -->
  <path d="M108 156 Q96 250 150 298 L138 208 Q116 178 108 156 Z" fill="url(#drape)"/>
  <path d="M292 156 Q304 250 250 298 L262 208 Q284 178 292 156 Z" fill="url(#drape)"/>

  <!-- face features, minimal/friendly -->
  <g stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M164 158 q8 -8 16 0"/>
    <path d="M220 158 q8 -8 16 0"/>
    <path d="M186 212 q14 10 28 0"/>
  </g>
  <path d="M196 176 q4 14 -2 20" stroke="#1D1D1F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- cheeks, a little life -->
  <ellipse cx="152" cy="194" rx="12" ry="7" fill="#0071E3" opacity="0.14"/>
  <ellipse cx="248" cy="194" rx="12" ry="7" fill="#0071E3" opacity="0.14"/>
</svg>
